<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>导出 PDF · Folio</title>
  </head>
  <body>
    <div class="toolbar" role="toolbar" aria-label="打印设置">
      <span class="toolbar__title" id="doc-title">加载中…</span>

      <div class="toolbar__group">
        <span class="toolbar__label">主题</span>
        <div class="segmented" role="group" aria-label="纸张主题">
          <button class="segmented__btn" type="button" data-theme="light" aria-pressed="true">
            浅色
          </button>
          <button class="segmented__btn" type="button" data-theme="sepia" aria-pressed="false">
            护眼
          </button>
        </div>
      </div>

      <div class="toolbar__group">
        <span class="toolbar__label">字号</span>
        <div class="stepper">
          <button class="stepper__btn" type="button" id="font-down" aria-label="减小字号">−</button>
          <span class="stepper__value" id="font-value">11pt</span>
          <button class="stepper__btn" type="button" id="font-up" aria-label="增大字号">+</button>
        </div>
      </div>

      <div class="toolbar__group">
        <span class="toolbar__label">图片</span>
        <div class="segmented" role="group" aria-label="图片大小">
          <button class="segmented__btn" type="button" data-imgsize="large" aria-pressed="true">
            大
          </button>
          <button class="segmented__btn" type="button" data-imgsize="medium" aria-pressed="false">
            中
          </button>
          <button class="segmented__btn" type="button" data-imgsize="small" aria-pressed="false">
            小
          </button>
        </div>
      </div>

      <div class="toolbar__spacer"></div>

      <div class="toolbar__group">
        <span class="toolbar__label">A4 · 174mm 行宽</span>
        <span class="toolbar__pagecount" id="page-count" role="status" aria-live="polite"></span>
        <button class="btn" type="button" id="print-btn" disabled>打印 / 存为 PDF</button>
      </div>
    </div>

    <div class="status status--hidden" id="status" role="status" aria-live="polite"></div>

    <main class="page">
      <!--
        The measuring surface. Laid out once at the print column width and kept
        out of sight; the visible sheets below are clones of it, shifted to
        each page's slice. It is never removed, because changing the font size
        or image size reflows it and every page has to be cut again.
      -->
      <div class="sheet sheet--light" id="sheet"></div>
      <div class="p-sheets" id="pages"></div>
    </main>

    <script type="module" src="/src/print/main.ts"></script>
  </body>
</html>
