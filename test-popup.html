<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试 Popup</title>
  <style>
    body {
      font-family: system-ui;
      padding: 20px;
      width: 360px;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    button {
      padding: 8px 16px;
      margin: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Popup 诊断工具</h2>
  
  <div id="status"></div>
  
  <button id="testLog">测试日志</button>
  <button id="testState">测试状态</button>
  <button id="testMessage">测试消息</button>
  
  <div id="output"></div>

  <script>
    console.log('=== 测试脚本开始执行 ===');
    
    const status = document.getElementById('status');
    const output = document.getElementById('output');
    
    function log(message, type = 'info') {
      console.log(message);
      const div = document.createElement('div');
      div.className = `status ${type === 'error' ? 'error' : 'success'}`;
      div.textContent = message;
      output.appendChild(div);
    }
    
    log('✅ HTML 加载成功');
    log('✅ JavaScript 执行成功');
    
    // 测试日志
    document.getElementById('testLog').addEventListener('click', () => {
      console.log('🔘 测试日志按钮被点击');
      log('🔘 测试日志按钮被点击');
    });
    
    // 测试状态
    document.getElementById('testState').addEventListener('click', async () => {
      console.log('🔍 测试状态按钮被点击');
      log('🔍 正在获取标签页...');
      
      try {
        const tabs = await chrome.tabs.query({ active: true, currentWindow: true });
        console.log('标签页:', tabs);
        log(`✅ 找到 ${tabs.length} 个标签页`);
        
        if (tabs[0]) {
          log(`当前页面: ${tabs[0].url}`);
        }
      } catch (error) {
        console.error('获取标签页失败:', error);
        log(`❌ 错误: ${error.message}`, 'error');
      }
    });
    
    // 测试消息
    document.getElementById('testMessage').addEventListener('click', async () => {
      console.log('📤 测试消息按钮被点击');
      log('📤 正在发送消息...');
      
      try {
        const tabs = await chrome.tabs.query({ active: true, currentWindow: true });
        if (!tabs[0]) {
          throw new Error('未找到活动标签页');
        }
        
        const response = await chrome.tabs.sendMessage(tabs[0].id, {
          action: 'GET_READING_MODE_STATE'
        });
        
        console.log('收到响应:', response);
        log(`✅ 收到响应: ${JSON.stringify(response)}`);
      } catch (error) {
        console.error('发送消息失败:', error);
        log(`❌ 错误: ${error.message}`, 'error');
      }
    });
    
    console.log('=== 测试脚本执行完成 ===');
  </script>
</body>
</html>
