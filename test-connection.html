<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扩展连接测试页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-weight: bold;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .warning { background: #fff3cd; color: #856404; }
        .info { background: #d1ecf1; color: #0c5460; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
        .log {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🔧 Chrome 扩展连接测试页面</h1>
    
    <div class="test-section">
        <h2>📋 扩展状态检查</h2>
        <div id="extensionStatus" class="status info">检查中...</div>
        <button onclick="checkExtensionStatus()">重新检查扩展状态</button>
    </div>

    <div class="test-section">
        <h2>📤 消息通信测试</h2>
        <div id="messageStatus" class="status info">准备测试...</div>
        <button onclick="testMessageCommunication()">测试消息通信</button>
        <button onclick="testReadingModeToggle()">测试阅读模式切换</button>
        <button onclick="testGetState()">测试获取状态</button>
    </div>

    <div class="test-section">
        <h2>🎨 阅读模式测试</h2>
        <div id="readingModeStatus" class="status info">准备测试...</div>
        <button onclick="enableReadingMode()">启用阅读模式</button>
        <button onclick="disableReadingMode()">禁用阅读模式</button>
        <button onclick="applyPreset()">应用预设</button>
    </div>

    <div class="test-section">
        <h2>📝 调试日志</h2>
        <div id="debugLog" class="log"></div>
        <button onclick="clearLog()">清空日志</button>
    </div>

    <script>
        let currentTab = null;

        // 日志函数
        function log(message, type = 'info') {
            const logDiv = document.getElementById('debugLog');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `[${timestamp}] ${message}`;
            logDiv.appendChild(logEntry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function clearLog() {
            document.getElementById('debugLog').innerHTML = '';
        }

        // 获取当前标签页
        async function getCurrentTab() {
            try {
                const tabs = await chrome.tabs.query({ active: true, currentWindow: true });
                if (tabs && tabs.length > 0) {
                    currentTab = tabs[0];
                    log(`✅ 获取到当前标签页: ${currentTab.url}`, 'success');
                    return currentTab;
                } else {
                    log('❌ 无法获取当前标签页', 'error');
                    return null;
                }
            } catch (error) {
                log(`❌ 获取标签页失败: ${error.message}`, 'error');
                return null;
            }
        }

        // 检查扩展状态
        async function checkExtensionStatus() {
            const statusDiv = document.getElementById('extensionStatus');
            statusDiv.className = 'status info';
            statusDiv.textContent = '检查中...';

            try {
                // 检查扩展是否已安装
                const manifest = chrome.runtime.getManifest();
                log(`✅ 扩展已安装: ${manifest.name} v${manifest.version}`, 'success');
                
                // 获取当前标签页
                const tab = await getCurrentTab();
                if (tab) {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = `✅ 扩展正常，当前页面: ${tab.url}`;
                } else {
                    statusDiv.className = 'status error';
                    statusDiv.textContent = '❌ 无法获取当前标签页';
                }
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ 扩展检查失败: ${error.message}`;
                log(`❌ 扩展检查失败: ${error.message}`, 'error');
            }
        }

        // 测试消息通信
        async function testMessageCommunication() {
            const statusDiv = document.getElementById('messageStatus');
            statusDiv.className = 'status info';
            statusDiv.textContent = '测试中...';

            try {
                const tab = await getCurrentTab();
                if (!tab?.id) {
                    throw new Error('无法获取标签页ID');
                }

                log('📤 发送测试消息...', 'info');
                const response = await chrome.tabs.sendMessage(tab.id, {
                    action: 'GET_READING_MODE_STATE'
                });

                log(`📥 收到响应: ${JSON.stringify(response)}`, 'success');
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ 消息通信正常';
            } catch (error) {
                log(`❌ 消息通信失败: ${error.message}`, 'error');
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ 消息通信失败: ${error.message}`;
            }
        }

        // 测试阅读模式切换
        async function testReadingModeToggle() {
            try {
                const tab = await getCurrentTab();
                if (!tab?.id) {
                    throw new Error('无法获取标签页ID');
                }

                log('🔄 测试阅读模式切换...', 'info');
                const response = await chrome.tabs.sendMessage(tab.id, {
                    action: 'TOGGLE_READING_MODE'
                });

                log(`✅ 阅读模式切换响应: ${JSON.stringify(response)}`, 'success');
            } catch (error) {
                log(`❌ 阅读模式切换失败: ${error.message}`, 'error');
            }
        }

        // 测试获取状态
        async function testGetState() {
            try {
                const tab = await getCurrentTab();
                if (!tab?.id) {
                    throw new Error('无法获取标签页ID');
                }

                log('📊 获取阅读模式状态...', 'info');
                const response = await chrome.tabs.sendMessage(tab.id, {
                    action: 'GET_READING_MODE_STATE'
                });

                log(`📊 当前状态: ${JSON.stringify(response)}`, 'info');
            } catch (error) {
                log(`❌ 获取状态失败: ${error.message}`, 'error');
            }
        }

        // 启用阅读模式
        async function enableReadingMode() {
            const statusDiv = document.getElementById('readingModeStatus');
            try {
                const tab = await getCurrentTab();
                if (!tab?.id) {
                    throw new Error('无法获取标签页ID');
                }

                log('🟢 启用阅读模式...', 'info');
                const response = await chrome.tabs.sendMessage(tab.id, {
                    action: 'ENABLE_READING_MODE',
                    settings: {
                        fontSize: 18,
                        lineHeight: 1.6,
                        fontFamily: 'default',
                        backgroundColor: 'white',
                        theme: 'light'
                    }
                });

                log(`✅ 启用阅读模式响应: ${JSON.stringify(response)}`, 'success');
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ 阅读模式已启用';
            } catch (error) {
                log(`❌ 启用阅读模式失败: ${error.message}`, 'error');
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ 启用失败: ${error.message}`;
            }
        }

        // 禁用阅读模式
        async function disableReadingMode() {
            const statusDiv = document.getElementById('readingModeStatus');
            try {
                const tab = await getCurrentTab();
                if (!tab?.id) {
                    throw new Error('无法获取标签页ID');
                }

                log('🔴 禁用阅读模式...', 'info');
                const response = await chrome.tabs.sendMessage(tab.id, {
                    action: 'DISABLE_READING_MODE'
                });

                log(`✅ 禁用阅读模式响应: ${JSON.stringify(response)}`, 'success');
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ 阅读模式已禁用';
            } catch (error) {
                log(`❌ 禁用阅读模式失败: ${error.message}`, 'error');
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ 禁用失败: ${error.message}`;
            }
        }

        // 应用预设
        async function applyPreset() {
            const statusDiv = document.getElementById('readingModeStatus');
            try {
                const tab = await getCurrentTab();
                if (!tab?.id) {
                    throw new Error('无法获取标签页ID');
                }

                const preset = {
                    name: '测试预设',
                    settings: {
                        fontSize: 20,
                        lineHeight: 1.8,
                        fontFamily: 'serif',
                        backgroundColor: '#f8f9fa',
                        theme: 'light'
                    }
                };

                log('🎨 应用预设...', 'info');
                const response = await chrome.tabs.sendMessage(tab.id, {
                    action: 'APPLY_PRESET',
                    preset: preset
                });

                log(`✅ 应用预设响应: ${JSON.stringify(response)}`, 'success');
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ 预设已应用';
            } catch (error) {
                log(`❌ 应用预设失败: ${error.message}`, 'error');
                statusDiv.className = 'status error';
                statusDiv.textContent = `❌ 应用失败: ${error.message}`;
            }
        }

        // 页面加载时自动检查
        window.addEventListener('load', () => {
            log('🚀 测试页面已加载', 'info');
            checkExtensionStatus();
        });
    </script>
</body>
</html>
