<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性能测试 - Chrome阅读插件</title>
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8fafc;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 1rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* 测试控制区域 */
        .test-controls {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        .test-controls h2 {
            color: #2d3748;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .control-group {
            margin-bottom: 1.5rem;
        }

        .control-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #4a5568;
        }

        .control-group select,
        .control-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            font-size: 1rem;
            background: white;
        }

        .control-group select:focus,
        .control-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 82, 246, 0.1);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        /* 测试结果区域 */
        .test-results {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        .test-results h2 {
            color: #2d3748;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .result-item {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
        }

        .result-item.success {
            border-color: #10b981;
            background: #d1fae5;
        }

        .result-item.error {
            border-color: #ef4444;
            background: #fee2e2;
        }

        .result-item.running {
            border-color: #3b82f6;
            background: #dbeafe;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .result-title {
            font-weight: 600;
            color: #2d3748;
        }

        .result-status {
            padding: 0.25rem 0.75rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .result-status.success {
            background: #10b981;
            color: white;
        }

        .result-status.error {
            background: #ef4444;
            color: white;
        }

        .result-status.running {
            background: #3b82f6;
            color: white;
        }

        .result-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .metric-item {
            padding: 0.75rem;
            background: white;
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
        }

        .metric-label {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 0.25rem;
        }

        .metric-value {
            font-size: 1.125rem;
            font-weight: 600;
            color: #2d3748;
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 0.5rem;
            background-color: #e5e7eb;
            border-radius: 0.25rem;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-fill {
            height: 100%;
            background-color: #3b82f6;
            transition: width 0.3s ease;
        }

        /* 统计信息 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .stat-card {
            padding: 1.5rem;
            background: white;
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.875rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header {
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .test-controls,
            .test-results {
                padding: 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            .result-metrics {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 隐藏元素 */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>性能测试控制台</h1>
            <p>Chrome阅读插件的性能测试和基准测试工具</p>
        </header>

        <!-- 测试控制区域 -->
        <section class="test-controls">
            <h2>测试配置</h2>
            
            <div class="control-group">
                <label for="test-type">测试类型</label>
                <select id="test-type">
                    <option value="quick">快速测试</option>
                    <option value="content-extraction">内容提取测试</option>
                    <option value="ui-rendering">UI渲染测试</option>
                    <option value="memory-usage">内存使用测试</option>
                    <option value="cpu-performance">CPU性能测试</option>
                    <option value="user-interaction">用户交互测试</option>
                    <option value="stress-test">压力测试</option>
                    <option value="comprehensive">综合测试</option>
                    <option value="regression">回归测试</option>
                </select>
            </div>

            <div class="control-group">
                <label for="iterations">迭代次数</label>
                <input type="number" id="iterations" value="5" min="1" max="100">
            </div>

            <div class="control-group">
                <label for="timeout">超时时间 (ms)</label>
                <input type="number" id="timeout" value="30000" min="5000" max="300000">
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="start-test">开始测试</button>
                <button class="btn btn-secondary" id="stop-test" disabled>停止测试</button>
                <button class="btn btn-success" id="export-results" disabled>导出结果</button>
                <button class="btn btn-danger" id="clear-results" disabled>清除结果</button>
            </div>
        </section>

        <!-- 测试进度 -->
        <section class="test-controls" id="test-progress" style="display: none;">
            <h2>测试进度</h2>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
            </div>
            <div id="progress-text">准备开始测试...</div>
        </section>

        <!-- 统计信息 -->
        <section class="test-results">
            <h2>测试统计</h2>
            <div class="stats-grid" id="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="total-tests">0</div>
                    <div class="stat-label">总测试数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="completed-tests">0</div>
                    <div class="stat-label">完成测试</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="failed-tests">0</div>
                    <div class="stat-label">失败测试</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="pass-rate">0%</div>
                    <div class="stat-label">通过率</div>
                </div>
            </div>
        </section>

        <!-- 测试结果 -->
        <section class="test-results">
            <h2>测试结果</h2>
            <div id="results-container">
                <p class="text-center text-gray-500">暂无测试结果</p>
            </div>
        </section>
    </div>

    <script type="module">
        // 导入性能测试模块
        import { 
            PerformanceTestSuite, 
            BenchmarkManager,
            getTestScenariosByType,
            getTestScenariosStats
        } from './tests/performance/index.js';

        // 全局变量
        let testSuite;
        let benchmarkManager;
        let currentTestId = null;
        let isTestRunning = false;

        // DOM 元素
        const startTestBtn = document.getElementById('start-test');
        const stopTestBtn = document.getElementById('stop-test');
        const exportResultsBtn = document.getElementById('export-results');
        const clearResultsBtn = document.getElementById('clear-results');
        const testProgress = document.getElementById('test-progress');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const resultsContainer = document.getElementById('results-container');

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializePerformanceTesting();
            setupEventListeners();
            updateStats();
        });

        /**
         * 初始化性能测试
         */
        function initializePerformanceTesting() {
            try {
                testSuite = new PerformanceTestSuite();
                benchmarkManager = new BenchmarkManager({
                    verbose: true,
                    enableMonitoring: true,
                    timeout: parseInt(document.getElementById('timeout').value),
                    retryCount: 3
                });

                console.log('性能测试模块初始化成功');
            } catch (error) {
                console.error('性能测试模块初始化失败:', error);
                showError('性能测试模块初始化失败: ' + error.message);
            }
        }

        /**
         * 设置事件监听器
         */
        function setupEventListeners() {
            startTestBtn.addEventListener('click', startTest);
            stopTestBtn.addEventListener('click', stopTest);
            exportResultsBtn.addEventListener('export-results', exportResults);
            clearResultsBtn.addEventListener('click', clearResults);
        }

        /**
         * 开始测试
         */
        async function startTest() {
            if (isTestRunning) {
                showError('测试正在进行中，请等待完成');
                return;
            }

            const testType = document.getElementById('test-type').value;
            const iterations = parseInt(document.getElementById('iterations').value);
            const timeout = parseInt(document.getElementById('timeout').value);

            if (!testType) {
                showError('请选择测试类型');
                return;
            }

            if (iterations < 1 || iterations > 100) {
                showError('迭代次数必须在1-100之间');
                return;
            }

            try {
                isTestRunning = true;
                updateUIState(true);
                showTestProgress();

                // 获取测试场景
                const scenarios = getTestScenariosByType(testType);
                if (scenarios.length === 0) {
                    throw new Error(`未找到测试类型 "${testType}" 的测试场景`);
                }

                // 更新配置
                benchmarkManager.updateConfig({ timeout });

                // 运行基准测试
                const benchmarkResult = await benchmarkManager.runBenchmark(
                    `${testType}-${Date.now()}`,
                    scenarios,
                    iterations
                );

                // 显示结果
                displayTestResult(benchmarkResult);
                updateStats();

                showSuccess(`测试完成: ${benchmarkResult.name}`);

            } catch (error) {
                console.error('测试执行失败:', error);
                showError('测试执行失败: ' + error.message);
            } finally {
                isTestRunning = false;
                updateUIState(false);
                hideTestProgress();
            }
        }

        /**
         * 停止测试
         */
        function stopTest() {
            if (currentTestId) {
                // 这里可以实现测试停止逻辑
                console.log('停止测试:', currentTestId);
                showWarning('测试已停止');
            }
        }

        /**
         * 导出结果
         */
        function exportResults() {
            try {
                const results = benchmarkManager.exportBenchmarks();
                const blob = new Blob([results], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `performance-test-results-${Date.now()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showSuccess('结果导出成功');
            } catch (error) {
                console.error('结果导出失败:', error);
                showError('结果导出失败: ' + error.message);
            }
        }

        /**
         * 清除结果
         */
        function clearResults() {
            if (confirm('确定要清除所有测试结果吗？')) {
                benchmarkManager.clearBenchmarks();
                resultsContainer.innerHTML = '<p class="text-center text-gray-500">暂无测试结果</p>';
                updateStats();
                showSuccess('测试结果已清除');
            }
        }

        /**
         * 显示测试结果
         */
        function displayTestResult(benchmarkResult) {
            const resultElement = document.createElement('div');
            resultElement.className = `result-item ${benchmarkResult.passed ? 'success' : 'error'}`;
            
            resultElement.innerHTML = `
                <div class="result-header">
                    <div class="result-title">${benchmarkResult.name}</div>
                    <div class="result-status ${benchmarkResult.passed ? 'success' : 'error'}">
                        ${benchmarkResult.passed ? '通过' : '失败'}
                    </div>
                </div>
                <div class="result-metrics">
                    <div class="metric-item">
                        <div class="metric-label">通过率</div>
                        <div class="metric-value">${(benchmarkResult.passRate * 100).toFixed(2)}%</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">样本数量</div>
                        <div class="metric-value">${benchmarkResult.statistics.sampleCount}</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">平均提取时间</div>
                        <div class="metric-value">${benchmarkResult.statistics.mean.extractionTime.toFixed(2)}ms</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">平均渲染时间</div>
                        <div class="metric-value">${benchmarkResult.statistics.mean.renderTime.toFixed(2)}ms</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">平均内存使用</div>
                        <div class="metric-value">${benchmarkResult.statistics.mean.memoryUsage.toFixed(2)}MB</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label">平均CPU使用</div>
                        <div class="metric-value">${benchmarkResult.statistics.mean.cpuUsage.toFixed(3)}s</div>
                    </div>
                </div>
            `;

            // 插入到结果容器顶部
            if (resultsContainer.querySelector('.text-center.text-gray-500')) {
                resultsContainer.innerHTML = '';
            }
            resultsContainer.insertBefore(resultElement, resultsContainer.firstChild);
        }

        /**
         * 更新统计信息
         */
        function updateStats() {
            try {
                const summary = benchmarkManager.getPerformanceSummary();
                
                document.getElementById('total-tests').textContent = summary.totalBenchmarks;
                document.getElementById('completed-tests').textContent = summary.passedBenchmarks;
                document.getElementById('failed-tests').textContent = summary.failedBenchmarks;
                document.getElementById('pass-rate').textContent = (summary.averagePassRate * 100).toFixed(1) + '%';
                
            } catch (error) {
                console.error('更新统计信息失败:', error);
            }
        }

        /**
         * 更新UI状态
         */
        function updateUIState(testing) {
            startTestBtn.disabled = testing;
            stopTestBtn.disabled = !testing;
            exportResultsBtn.disabled = testing;
            clearResultsBtn.disabled = testing;
        }

        /**
         * 显示测试进度
         */
        function showTestProgress() {
            testProgress.style.display = 'block';
            updateProgress(0, '准备开始测试...');
        }

        /**
         * 隐藏测试进度
         */
        function hideTestProgress() {
            testProgress.style.display = 'none';
        }

        /**
         * 更新进度
         */
        function updateProgress(percentage, text) {
            progressFill.style.width = percentage + '%';
            progressText.textContent = text;
        }

        /**
         * 显示成功消息
         */
        function showSuccess(message) {
            showMessage(message, 'success');
        }

        /**
         * 显示错误消息
         */
        function showError(message) {
            showMessage(message, 'error');
        }

        /**
         * 显示警告消息
         */
        function showWarning(message) {
            showMessage(message, 'warning');
        }

        /**
         * 显示消息
         */
        function showMessage(message, type) {
            const messageElement = document.createElement('div');
            messageElement.className = `alert alert-${type}`;
            messageElement.textContent = message;
            
            // 这里可以实现消息显示逻辑
            console.log(`[${type.toUpperCase()}] ${message}`);
            
            // 3秒后自动移除
            setTimeout(() => {
                if (messageElement.parentNode) {
                    messageElement.parentNode.removeChild(messageElement);
                }
            }, 3000);
        }

        // 添加一些CSS样式
        const style = document.createElement('style');
        style.textContent = `
            .alert {
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 1rem 1.5rem;
                border-radius: 0.5rem;
                color: white;
                font-weight: 500;
                z-index: 1000;
                animation: slideIn 0.3s ease;
            }
            
            .alert-success {
                background: #10b981;
            }
            
            .alert-error {
                background: #ef4444;
            }
            
            .alert-warning {
                background: #f59e0b;
            }
            
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            
            .text-center {
                text-align: center;
            }
            
            .text-gray-500 {
                color: #6b7280;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
