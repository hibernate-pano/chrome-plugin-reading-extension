<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集成测试控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            padding: 30px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .control-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
        }

        .control-item label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }

        .control-item select,
        .control-item input {
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .control-item select:focus,
        .control-item input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-warning:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-section {
            padding: 20px 30px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #6b7280;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            padding: 30px;
            background: white;
        }

        .stat-card {
            text-align: center;
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #4f46e5;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }

        .results {
            padding: 30px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .results-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #111827;
        }

        .results-actions {
            display: flex;
            gap: 10px;
        }

        .result-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.2s;
        }

        .result-item:hover {
            border-color: #4f46e5;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .result-name {
            font-weight: 600;
            color: #111827;
            font-size: 1.1rem;
        }

        .result-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-running {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-passed {
            background: #d1fae5;
            color: #065f46;
        }

        .status-failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-skipped {
            background: #f3f4f6;
            color: #374151;
        }

        .result-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .detail-value {
            font-size: 14px;
            color: #111827;
            font-weight: 500;
        }

        .result-errors {
            margin-top: 15px;
        }

        .error-item {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .error-type {
            font-weight: 600;
            color: #dc2626;
            margin-bottom: 5px;
        }

        .error-message {
            color: #991b1b;
            font-size: 14px;
        }

        .error-context {
            margin-top: 8px;
            font-size: 12px;
            color: #7f1d1d;
            background: #fecaca;
            padding: 8px;
            border-radius: 4px;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .no-results-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .no-results-text {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .no-results-subtext {
            font-size: 14px;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 8px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .controls {
                padding: 20px;
            }

            .control-group {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
                padding: 20px;
            }

            .results {
                padding: 20px;
            }

            .result-details {
                grid-template-columns: 1fr;
            }
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-icon {
            color: #10b981;
        }

        .error-icon {
            color: #ef4444;
        }

        .warning-icon {
            color: #f59e0b;
        }

        .info-icon {
            color: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔬 集成测试控制台</h1>
            <p>测试所有功能模块的集成和端到端功能</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <div class="control-item">
                    <label for="testType">测试类型</label>
                    <select id="testType">
                        <option value="all">全部测试</option>
                        <option value="core">核心功能</option>
                        <option value="ui">用户界面</option>
                        <option value="feature">功能特性</option>
                        <option value="integration">集成测试</option>
                        <option value="regression">回归测试</option>
                    </select>
                </div>
                <div class="control-item">
                    <label for="environment">测试环境</label>
                    <select id="environment">
                        <option value="testing">测试环境</option>
                        <option value="development">开发环境</option>
                        <option value="staging">预发布环境</option>
                        <option value="production">生产环境</option>
                    </select>
                </div>
                <div class="control-item">
                    <label for="timeout">超时时间 (秒)</label>
                    <input type="number" id="timeout" value="30" min="5" max="300">
                </div>
                <div class="control-item">
                    <label for="retries">重试次数</label>
                    <input type="number" id="retries" value="2" min="0" max="10">
                </div>
            </div>

            <div class="button-group">
                <button id="startTest" class="btn btn-primary">
                    <span class="loading" style="display: none;"></span>
                    🚀 开始测试
                </button>
                <button id="stopTest" class="btn btn-danger" disabled>
                    ⏹️ 停止测试
                </button>
                <button id="exportResults" class="btn btn-success" disabled>
                    📊 导出结果
                </button>
                <button id="clearResults" class="btn btn-warning" disabled>
                    🗑️ 清除结果
                </button>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text">
                <span id="progressText">准备就绪</span>
                <span id="progressPercent">0%</span>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalTests">0</div>
                <div class="stat-label">总测试数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="passedTests">0</div>
                <div class="stat-label">通过测试</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="failedTests">0</div>
                <div class="stat-label">失败测试</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="skippedTests">0</div>
                <div class="stat-label">跳过测试</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalDuration">0s</div>
                <div class="stat-label">总耗时</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="successRate">0%</div>
                <div class="stat-label">成功率</div>
            </div>
        </div>

        <div class="results">
            <div class="results-header">
                <h2 class="results-title">测试结果</h2>
                <div class="results-actions">
                    <button id="expandAll" class="btn btn-primary" style="padding: 8px 16px; font-size: 12px;">
                        📖 展开全部
                    </button>
                    <button id="collapseAll" class="btn btn-warning" style="padding: 8px 16px; font-size: 12px;">
                        📕 折叠全部
                    </button>
                </div>
            </div>
            <div id="resultsContainer">
                <div class="no-results">
                    <div class="no-results-icon">🧪</div>
                    <div class="no-results-text">暂无测试结果</div>
                    <div class="no-results-subtext">点击"开始测试"按钮开始运行集成测试</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // 集成测试控制台
        class IntegrationTestConsole {
            constructor() {
                this.isRunning = false;
                this.currentTest = null;
                this.testResults = [];
                this.initializeElements();
                this.bindEvents();
                this.updateStats();
            }

            initializeElements() {
                this.elements = {
                    startTest: document.getElementById('startTest'),
                    stopTest: document.getElementById('stopTest'),
                    exportResults: document.getElementById('exportResults'),
                    clearResults: document.getElementById('clearResults'),
                    progressFill: document.getElementById('progressFill'),
                    progressText: document.getElementById('progressText'),
                    progressPercent: document.getElementById('progressPercent'),
                    totalTests: document.getElementById('totalTests'),
                    passedTests: document.getElementById('passedTests'),
                    failedTests: document.getElementById('failedTests'),
                    skippedTests: document.getElementById('skippedTests'),
                    totalDuration: document.getElementById('totalDuration'),
                    successRate: document.getElementById('successRate'),
                    resultsContainer: document.getElementById('resultsContainer'),
                    expandAll: document.getElementById('expandAll'),
                    collapseAll: document.getElementById('collapseAll')
                };
            }

            bindEvents() {
                this.elements.startTest.addEventListener('click', () => this.startTest());
                this.elements.stopTest.addEventListener('click', () => this.stopTest());
                this.elements.exportResults.addEventListener('click', () => this.exportResults());
                this.elements.clearResults.addEventListener('click', () => this.clearResults());
                this.elements.expandAll.addEventListener('click', () => this.expandAllResults());
                this.elements.collapseAll.addEventListener('click', () => this.collapseAllResults());
            }

            async startTest() {
                if (this.isRunning) return;

                this.isRunning = true;
                this.updateUI();
                this.clearResults();

                try {
                    const testType = document.getElementById('testType').value;
                    const environment = document.getElementById('environment').value;
                    const timeout = parseInt(document.getElementById('timeout').value) * 1000;
                    const retries = parseInt(document.getElementById('retries').value);

                    console.log('开始集成测试:', { testType, environment, timeout, retries });

                    // 模拟测试执行
                    await this.runMockTests(testType, environment, timeout, retries);

                } catch (error) {
                    console.error('测试执行失败:', error);
                    this.addError('测试执行失败', error.message);
                } finally {
                    this.isRunning = false;
                    this.updateUI();
                }
            }

            async runMockTests(testType, environment, timeout, retries) {
                const testModules = this.getTestModules(testType);
                const totalTests = testModules.length;
                let completedTests = 0;

                for (const module of testModules) {
                    if (!this.isRunning) break;

                    this.updateProgress(completedTests, totalTests);
                    this.addTestResult(module, 'running');

                    try {
                        // 模拟测试执行时间
                        const testDuration = Math.random() * 2000 + 500;
                        await this.delay(testDuration);

                        // 模拟测试结果
                        const testResult = this.simulateTestResult(module);
                        this.updateTestResult(module.name, testResult);
                        completedTests++;

                    } catch (error) {
                        this.updateTestResult(module.name, {
                            status: 'failed',
                            error: error.message,
                            duration: 0
                        });
                        completedTests++;
                    }
                }

                this.updateProgress(completedTests, totalTests);
                this.updateStats();
            }

            getTestModules(testType) {
                const allModules = [
                    { name: 'ContentExtractor', description: '内容提取器', type: 'core', priority: 'critical' },
                    { name: 'ReadingModeUI', description: '阅读模式UI', type: 'ui', priority: 'high' },
                    { name: 'AccessibilityManager', description: '无障碍功能管理器', type: 'feature', priority: 'high' },
                    { name: 'PerformanceTestSuite', description: '性能测试套件', type: 'utility', priority: 'medium' },
                    { name: 'IntegrationTestSuite', description: '集成测试套件', type: 'integration', priority: 'medium' },
                    { name: 'StorageManager', description: '存储管理器', type: 'core', priority: 'high' },
                    { name: 'NetworkManager', description: '网络管理器', type: 'core', priority: 'medium' },
                    { name: 'ErrorHandler', description: '错误处理器', type: 'utility', priority: 'high' }
                ];

                if (testType === 'all') return allModules;
                return allModules.filter(module => module.type === testType);
            }

            simulateTestResult(module) {
                const random = Math.random();
                let status, error;

                if (random < 0.8) {
                    status = 'passed';
                } else if (random < 0.95) {
                    status = 'failed';
                    error = this.getRandomError();
                } else {
                    status = 'skipped';
                }

                return {
                    status,
                    error,
                    duration: Math.random() * 1000 + 200,
                    performance: {
                        memoryUsage: Math.random() * 50 + 10,
                        cpuUsage: Math.random() * 20 + 5
                    }
                };
            }

            getRandomError() {
                const errors = [
                    '模块初始化失败',
                    '依赖项缺失',
                    '配置错误',
                    '网络超时',
                    '内存不足',
                    '权限被拒绝',
                    '文件不存在',
                    '类型错误'
                ];
                return errors[Math.floor(Math.random() * errors.length)];
            }

            addTestResult(module, status) {
                const result = {
                    name: module.name,
                    description: module.description,
                    type: module.type,
                    priority: module.priority,
                    status,
                    startTime: Date.now(),
                    duration: 0,
                    error: null,
                    performance: null
                };

                this.testResults.push(result);
                this.renderTestResult(result);
            }

            updateTestResult(testName, result) {
                const testResult = this.testResults.find(r => r.name === testName);
                if (testResult) {
                    Object.assign(testResult, result);
                    testResult.endTime = Date.now();
                    this.updateTestResultUI(testResult);
                }
            }

            renderTestResult(result) {
                const resultElement = document.createElement('div');
                resultElement.className = 'result-item';
                resultElement.id = `result-${result.name}`;
                resultElement.innerHTML = this.getTestResultHTML(result);
                this.elements.resultsContainer.appendChild(resultElement);
            }

            getTestResultHTML(result) {
                const statusClass = `status-${result.status}`;
                const statusText = this.getStatusText(result.status);
                const statusIcon = this.getStatusIcon(result.status);

                return `
                    <div class="result-header">
                        <div class="result-name">${result.name}</div>
                        <div class="result-status ${statusClass}">${statusIcon} ${statusText}</div>
                    </div>
                    <div class="result-details">
                        <div class="detail-item">
                            <div class="detail-label">描述</div>
                            <div class="detail-value">${result.description}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">类型</div>
                            <div class="detail-value">${result.type}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">优先级</div>
                            <div class="detail-value">${result.priority}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">状态</div>
                            <div class="detail-value">${statusText}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">耗时</div>
                            <div class="detail-value">${result.duration}ms</div>
                        </div>
                        ${result.performance ? `
                            <div class="detail-item">
                                <div class="detail-label">内存使用</div>
                                <div class="detail-value">${result.performance.memoryUsage.toFixed(1)}MB</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">CPU使用</div>
                                <div class="detail-value">${result.performance.cpuUsage.toFixed(1)}%</div>
                            </div>
                        ` : ''}
                    </div>
                    ${result.error ? `
                        <div class="result-errors">
                            <div class="error-item">
                                <div class="error-type">❌ 错误信息</div>
                                <div class="error-message">${result.error}</div>
                            </div>
                        </div>
                    ` : ''}
                `;
            }

            updateTestResultUI(result) {
                const resultElement = document.getElementById(`result-${result.name}`);
                if (resultElement) {
                    resultElement.innerHTML = this.getTestResultHTML(result);
                }
            }

            getStatusText(status) {
                const statusMap = {
                    pending: '等待中',
                    running: '运行中',
                    passed: '通过',
                    failed: '失败',
                    skipped: '跳过'
                };
                return statusMap[status] || status;
            }

            getStatusIcon(status) {
                const iconMap = {
                    pending: '⏳',
                    running: '🔄',
                    passed: '✅',
                    failed: '❌',
                    skipped: '⏭️'
                };
                return iconMap[status] || '❓';
            }

            updateProgress(completed, total) {
                const percentage = total > 0 ? (completed / total) * 100 : 0;
                this.elements.progressFill.style.width = `${percentage}%`;
                this.elements.progressPercent.textContent = `${Math.round(percentage)}%`;

                if (completed === 0) {
                    this.elements.progressText.textContent = '准备就绪';
                } else if (completed === total) {
                    this.elements.progressText.textContent = '测试完成';
                } else {
                    this.elements.progressText.textContent = `测试中... ${completed}/${total}`;
                }
            }

            updateStats() {
                const total = this.testResults.length;
                const passed = this.testResults.filter(r => r.status === 'passed').length;
                const failed = this.testResults.filter(r => r.status === 'failed').length;
                const skipped = this.testResults.filter(r => r.status === 'skipped').length;
                const successRate = total > 0 ? Math.round((passed / total) * 100) : 0;

                const totalDuration = this.testResults.reduce((sum, r) => sum + r.duration, 0);

                this.elements.totalTests.textContent = total;
                this.elements.passedTests.textContent = passed;
                this.elements.failedTests.textContent = failed;
                this.elements.skippedTests.textContent = skipped;
                this.elements.totalDuration.textContent = `${(totalDuration / 1000).toFixed(1)}s`;
                this.elements.successRate.textContent = `${successRate}%`;
            }

            updateUI() {
                this.elements.startTest.disabled = this.isRunning;
                this.elements.stopTest.disabled = !this.isRunning;
                this.elements.exportResults.disabled = this.testResults.length === 0;
                this.elements.clearResults.disabled = this.testResults.length === 0;

                const loadingSpinner = this.elements.startTest.querySelector('.loading');
                if (this.isRunning) {
                    loadingSpinner.style.display = 'inline-block';
                    this.elements.startTest.textContent = '🔄 测试中...';
                } else {
                    loadingSpinner.style.display = 'none';
                    this.elements.startTest.textContent = '🚀 开始测试';
                }
            }

            stopTest() {
                this.isRunning = false;
                this.updateUI();
                this.elements.progressText.textContent = '测试已停止';
            }

            exportResults() {
                const data = {
                    timestamp: new Date().toISOString(),
                    testResults: this.testResults,
                    summary: {
                        total: this.testResults.length,
                        passed: this.testResults.filter(r => r.status === 'passed').length,
                        failed: this.testResults.filter(r => r.status === 'failed').length,
                        skipped: this.testResults.filter(r => r.status === 'skipped').length,
                        successRate: this.testResults.length > 0 ? 
                            Math.round((this.testResults.filter(r => r.status === 'passed').length / this.testResults.length) * 100) : 0
                    }
                };

                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `integration-test-results-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            }

            clearResults() {
                this.testResults = [];
                this.elements.resultsContainer.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🧪</div>
                        <div class="no-results-text">暂无测试结果</div>
                        <div class="no-results-subtext">点击"开始测试"按钮开始运行集成测试</div>
                    </div>
                `;
                this.updateStats();
                this.updateProgress(0, 0);
            }

            expandAllResults() {
                // 实现展开所有结果的逻辑
                console.log('展开所有结果');
            }

            collapseAllResults() {
                // 实现折叠所有结果的逻辑
                console.log('折叠所有结果');
            }

            addError(title, message) {
                const errorResult = {
                    name: title,
                    description: message,
                    type: 'error',
                    priority: 'critical',
                    status: 'failed',
                    startTime: Date.now(),
                    endTime: Date.now(),
                    duration: 0,
                    error: message,
                    performance: null
                };

                this.testResults.push(errorResult);
                this.renderTestResult(errorResult);
                this.updateStats();
            }

            delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        }

        // 初始化控制台
        document.addEventListener('DOMContentLoaded', () => {
            new IntegrationTestConsole();
        });
    </script>
</body>
</html>
