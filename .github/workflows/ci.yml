name: CI

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch on new commits
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Test
        # Enforces the coverage ratchet in vitest.config.ts. No `|| true`:
        # a coverage regression fails the build like any other test failure.
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

  # Verify the extension manifest is well-formed and that its version matches
  # the repo's version of record before anything gets published.
  manifest-check:
    name: Manifest sanity check
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Verify manifest references exist
        run: |
          set -euo pipefail
          test -f dist/manifest.json || { echo "dist/manifest.json missing"; exit 1; }
          node -e '
            const fs = require("fs");
            const path = require("path");
            const manifest = JSON.parse(fs.readFileSync("dist/manifest.json", "utf8"));
            if (manifest.manifest_version !== 3) { console.error("manifest_version must be 3"); process.exit(1); }
            if (manifest.background?.service_worker) {
              const sw = manifest.background.service_worker;
              if (!fs.existsSync(path.join("dist", sw))) { console.error(`background.service_worker file missing: ${sw}`); process.exit(1); }
            }
            for (const cs of manifest.content_scripts || []) {
              for (const js of cs.js || []) {
                if (!fs.existsSync(path.join("dist", js))) { console.error(`content_scripts.js file missing: ${js}`); process.exit(1); }
              }
            }
            if (manifest.action?.default_icon) {
              for (const icon of Object.values(manifest.action.default_icon)) {
                if (!fs.existsSync(path.join("dist", icon))) { console.error(`action.default_icon file missing: ${icon}`); process.exit(1); }
              }
            }
            console.log("manifest references OK");
          '

      - name: Verify version consistency
        # package.json is the version of record. public/manifest.json is what
        # actually ships; dist/manifest.json is the copy the build produced.
        # All three must agree, or the Chrome Web Store gets a version nobody
        # can trace back to a commit.
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const path = require("path");

            const fail = (msg) => { console.error(`version check FAILED: ${msg}`); process.exit(1); };

            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const src = JSON.parse(fs.readFileSync(path.join("public", "manifest.json"), "utf8"));
            const dist = JSON.parse(fs.readFileSync(path.join("dist", "manifest.json"), "utf8"));

            // Chrome accepts 1-4 dot-separated integers, each 0-65535.
            const VERSION_RE = /^\d{1,5}(\.\d{1,5}){0,3}$/;

            const sources = [
              ["package.json", pkg.version],
              ["public/manifest.json", src.version],
              ["dist/manifest.json", dist.version],
            ];

            for (const [label, value] of sources) {
              if (typeof value !== "string" || !VERSION_RE.test(value)) {
                fail(`${label} version ${JSON.stringify(value)} is not a valid Chrome extension version`);
              }
            }

            if (src.version !== pkg.version) {
              fail(`public/manifest.json is "${src.version}" but package.json is "${pkg.version}" - bump both together`);
            }
            if (dist.version !== pkg.version) {
              fail(`dist/manifest.json is "${dist.version}" but package.json is "${pkg.version}" - dist is stale, rebuild`);
            }

            console.log(`version consistency OK: ${pkg.version}`);
          '
